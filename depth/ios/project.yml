# XcodeGen spec for DepthProbe (front TrueDepth depth -> edge service). Generate with:
#   cd depth/ios && xcodegen generate        (writes DepthProbe.xcodeproj)
# Build the IPA: depth/ios/build_install.sh --ipa -> unsigned dist/DepthProbe-<MARKETING_VERSION>.ipa, installed with
# Sideloadly. (Direct xcodebuild with the free Personal Team fails at install on this iPhone: "The provisioning
# profile is banned".)
name: DepthProbe
options:
  bundleIdPrefix: com.prajwalm
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  DepthProbe:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DepthProbe
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_NAME: DepthProbe
        PRODUCT_BUNDLE_IDENTIFIER: com.prajwalm.depthprobe
        INFOPLIST_FILE: DepthProbe/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.3.1"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_PREVIEWS: NO
    scheme: {}
