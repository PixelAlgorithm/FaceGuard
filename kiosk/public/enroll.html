<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FaceGuard · Enrolment moved to /register</title>
<!--
  Legacy enrolment page, retired: it redirects to /register (same query string), which implements the
  API.md v1.4 flow (R-A): consent with DPDP text, admin token, then for a new person / role change / erased
  person PUT /v1/admin/access/users/{user_id} {display, role, consent: true} FIRST (ONLINE only; the edge
  installs the re-signed bundle), THEN 5 quality-gated frames at up to 1280 px -> POST /v1/enroll, with
  cloud_state / warnings shown and "Re-admit and enrol" after a DPDP erasure. Enrolled users:
  GET /v1/admin/users; erasure: DELETE /v1/enroll/{user_id}. No personal data is kept in this static file.
-->
<script>
  (function () {
    var target = '/register' + window.location.search + window.location.hash;
    window.location.replace(target);
  })();
</script>
<style>
  body { margin: 0; font: 18px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #0b0f14; color: #e8eef6; }
  main { max-width: 40rem; margin: 15vh auto; padding: 0 24px; }
  a { color: #60a5fa; }
</style>
</head>
<body>
<main>
  <h1>Enrolment has moved</h1>
  <p>Opening <a id="go" href="/register">/register</a>&hellip; If nothing happens, follow the link.</p>
</main>
</body>
</html>
