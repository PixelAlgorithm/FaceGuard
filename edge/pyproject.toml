[project]
name = "hid-edge"
version = "0.1.0"
description = "HID kiosk local edge service: liveness, matcher, policy engine, offline store"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0",
  "numpy>=1.26,<2.3",
  "opencv-python-headless>=4.10",
  "onnxruntime>=1.18",
  "uniface>=1.0",
  "pyotp>=2.9",
  "cryptography>=42",
  "httpx>=0.27",
  "python-ulid>=2.7",
  "tzdata>=2024.1",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["policy/tests", "offline/tests", "tests"]
pythonpath = [".."]
markers = ["models: needs the downloaded ONNX weights in models/ (bash scripts/fetch_models.sh)"]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning:starlette.*", "ignore::DeprecationWarning:fastapi.*"]
