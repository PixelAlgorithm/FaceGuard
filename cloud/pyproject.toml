[project]
name = "hid-cloud"
version = "0.1.0"
description = "HID kiosk cloud API: Rekognition match/enrolment, signed schedule bundles, revocations, idempotent sync, email OTP"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7,<3",
  "python-multipart>=0.0.9",
  "boto3>=1.35",
  "pyyaml>=6.0",
  "cryptography>=42",
  "tzdata>=2024.1",
  "httpx>=0.27",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "moto[dynamodb,s3,ses,sesv2]>=5.0",
  "ruff>=0.6",
  "python-ulid>=2.7",  # test-only: lets tests import the edge sync agent (edge/offline/sync.py)
]
lambda = ["mangum>=0.17"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py311"
# vendored wheels + staged copies of the app (build_artifact.sh) are not our source
extend-exclude = ["infra/build", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "B008", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning:botocore.*"]
